<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <title>CampusPulse — Secure sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/home.css">
    <link rel="modulepreload" href="/api.js">
  <style>
    :root { --ink: #17241e; --paper: #f7f6f1; --surface: #fffefa; --green: #345f47; --line: #dedfd6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .secure-card { width: min(100%, 520px); padding: clamp(28px, 6vw, 48px); border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: 0 24px 70px rgba(23, 36, 30, .08); }
    .secure-card .eyebrow { margin: 0 0 14px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .secure-card h1 { margin: 0 0 14px; font: 800 clamp(30px, 7vw, 44px)/1.08 "Manrope", sans-serif; letter-spacing: -.05em; }
    .secure-card p:not(.eyebrow) { margin: 0; color: #526057; font-size: 15px; line-height: 1.7; }
    .secure-card a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 26px; padding: 0 22px; border-radius: 999px; background: var(--green); color: #fffefa; font-size: 13px; font-weight: 700; text-decoration: none; }
    .secure-card a:hover { background: #284c38; }
    .secure-card a:focus-visible { outline: 3px solid #d8f078; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <section class="secure-card" aria-labelledby="secure-title">
      <p class="eyebrow">CampusPulse · Secure access</p>
      <h1 id="secure-title">One trusted sign-in flow</h1>
      <p>Student registration and sign-in use the shared campus authentication flow. Your trusted profile role is checked before routing; faculty and admin access remains invitation-only.</p>
      <a href="/login">Continue to sign in or create a student account</a>
    </section>
  </main>
</body>
</html>
